[project]
name = "fraud-agent"
version = "0.1.0"
description = "Agentic fraud investigation on TigerGraph -- HH GOA / IEEE hackathon"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # data / profiling / calibration (Phase 0-2)
    "duckdb>=1.5,<2",
    "pandas>=3.0,<4",
    "pyarrow>=25,<26",
    "scikit-learn>=1.9,<2",
    "joblib>=1.6,<2",
    "numpy>=2.4,<3",
    # graph client + MCP (Phase 1-3)
    "requests>=2.34,<3",
    "python-dotenv>=1.2,<2",
    "pyTigerGraph>=2.0.4,<3",
    "tigergraph-mcp>=1.0.3,<2",
    "mcp>=1.30,<2",
    # LLM / agent (Phase 3-5)
    "openai>=3.16,<4",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "langchain-google-genai>=4.4,<5",   # native SDK required: Gemini 3.x OpenAI-compat breaks multi-turn tool calls, see NOTES.md
    "langchain-openai>=1.6,<2",         # NVIDIA fallback (OpenAI-compatible endpoint)
    # embeddings + UI (Phase 4/7)
    "sentence-transformers>=3,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "tigergraph*", "detectors*", "graphrag*", "api*"]
