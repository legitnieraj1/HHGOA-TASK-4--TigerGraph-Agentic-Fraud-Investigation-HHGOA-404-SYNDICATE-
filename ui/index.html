<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud Investigation Agent</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --panel-2: #161c2a; --border: #232b3d;
    --text: #e6e9f0; --muted: #8891a7; --accent: #4f8cff;
    --fraud: #ef5a5a; --legit: #46c98a; --uncertain: #e8b93a;
    --l1: #e8b93a; --l2: #ef5a5a; --auto: #46c98a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 320px 1fr 340px; height: calc(100vh - 57px); }
  .col { overflow-y: auto; border-right: 1px solid var(--border); }
  .col:last-child { border-right: none; }
  .case-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .case-item:hover { background: var(--panel-2); }
  .case-item.active { background: var(--panel-2); border-left: 3px solid var(--accent); }
  .case-item .id { font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-right: 4px; }
  .badge.fraud { background: rgba(239,90,90,.15); color: var(--fraud); }
  .badge.legitimate { background: rgba(70,201,138,.15); color: var(--legit); }
  .badge.uncertain { background: rgba(232,185,58,.15); color: var(--uncertain); }
  .badge.route-auto { background: rgba(70,201,138,.15); color: var(--auto); }
  .badge.route-L1 { background: rgba(232,185,58,.15); color: var(--l1); }
  .badge.route-L2 { background: rgba(239,90,90,.15); color: var(--l2); }
  .badge.pending { background: rgba(232,185,58,.2); color: var(--uncertain); }
  .muted { color: var(--muted); }
  section.panel { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  section.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .meter { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; margin: 8px 0; }
  .meter .fill { height: 100%; background: linear-gradient(90deg, var(--legit), var(--uncertain), var(--fraud)); }
  .evidence-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .evidence-item .src { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .nba-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .nba-cols h3 { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .action-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .action-row .name { font-weight: 600; font-size: 13px; }
  .action-row .reason { font-size: 11px; color: var(--muted); }
  button.approve { background: var(--legit); color: #06231a; border: none; border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
  button.reject { background: transparent; color: var(--fraud); border: 1px solid var(--fraud); border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-left: 6px; }
  .decided { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
  .decided.approved { background: rgba(70,201,138,.15); color: var(--legit); }
  .decided.rejected { background: rgba(239,90,90,.15); color: var(--fraud); }
  pre.narrative { white-space: pre-wrap; font-family: inherit; background: var(--panel-2); padding: 12px; border-radius: 8px; font-size: 13px; }
  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; }
  .chat-msg { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-size: 13px; }
  .chat-msg.user { background: rgba(79,140,255,.12); }
  .chat-form { border-top: 1px solid var(--border); padding: 12px; display: grid; gap: 6px; }
  .chat-form input { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px; font-size: 12px; }
  .chat-form button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px; font-weight: 600; cursor: pointer; }
  .empty { padding: 40px 24px; color: var(--muted); text-align: center; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .timeline { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .timeline .step { background: var(--panel-2); padding: 4px 10px; border-radius: 6px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Fraud Investigation Agent</h1>
  <span class="sub" id="health-sub">connecting...</span>
</header>
<div class="layout">
  <div class="col" id="case-list"></div>
  <div class="col" id="case-detail"><div class="empty">Select a case</div></div>
  <div class="col chat">
    <div class="chat-log" id="chat-log">
      <div class="chat-msg">Trigger or steer a live investigation. Give a flagged transaction id, card id and customer id (from the dataset) and a reason.</div>
    </div>
    <form class="chat-form" id="chat-form">
      <input name="flagged_txn_id" placeholder="flagged transaction id (e.g. 3514030)" required>
      <input name="card_id" placeholder="card id (e.g. C12382-K1)" required>
      <input name="customer_id" placeholder="customer id (e.g. C12382)" required>
      <input name="trigger_text" placeholder="why (e.g. analyst spotted unusual activity)" required>
      <button type="submit">Investigate</button>
    </form>
  </div>
</div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
let currentCase = null;

async function loadCases() {
  const r = await fetch('/api/health'); const h = await r.json();
  $('#health-sub').textContent = h.ok ? `${h.cases_on_disk} case(s) on disk` : 'offline';
  const cases = await (await fetch('/api/cases')).json();
  const list = $('#case-list');
  list.innerHTML = cases.map(c => `
    <div class="case-item" data-id="${c.case_id}">
      <div class="id">${c.case_id} ${c.pending_approvals ? `<span class="badge pending">${c.pending_approvals} pending</span>` : ''}</div>
      <div><span class="badge ${c.verdict}">${c.verdict}</span><span class="muted">${c.pattern}</span></div>
      <div class="muted">$${c.exposure_usd.toLocaleString()} · p=${c.fraud_probability.toFixed(2)} ${c.sar_filed ? '· SAR' : ''}</div>
    </div>`).join('') || '<div class="empty">No cases yet. Run scripts/60_run_benchmark.py or trigger one live.</div>';
  $$('.case-item', list).forEach(el => el.onclick = () => openCase(el.dataset.id));
}

function meterColor(p) { return p; }

async function openCase(id) {
  currentCase = id;
  $$('.case-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const d = await (await fetch(`/api/cases/${id}`)).json();
  const c = d.case;
  const approvals = d._approvals || {};
  const evRows = c.evidence.map(e => `
    <div class="evidence-item"><div class="src">${e.source} · ${e.ref}</div>${e.claim}</div>`).join('');
  const nbaRow = (a, phase) => {
    const dec = approvals[a.action];
    const btns = a.route === 'auto' ? '<span class="muted">auto-executed</span>'
      : dec ? `<span class="decided ${dec}">${dec}</span>`
      : phase === 'final' ? `<button class="approve" onclick="approve('${a.action}','approved')">Approve</button><button class="reject" onclick="approve('${a.action}','rejected')">Reject</button>`
      : '<span class="muted">pending</span>';
    return `<div class="action-row">
      <div><div class="name">${a.action} <span class="badge route-${a.route}">${a.route}</span></div><div class="reason">${a.reason}</div></div>
      <div>${btns}</div></div>`;
  };
  $('#case-detail').innerHTML = `
    <section class="panel">
      <h2>Timeline</h2>
      <div class="timeline">
        <span class="step">trigger</span><span class="step">evidence (${c.evidence.length})</span>
        <span class="step">assess</span><span class="step">${d.evidence_requests.length} evidence request(s)</span>
        <span class="step">${d.next_best_actions.final.length} action(s)</span><span class="step">${c.status}</span>
      </div>
      <div class="muted">${c.summary}</div>
    </section>
    <section class="panel">
      <h2>Uncertainty · fraud probability ${c.fraud_probability.toFixed(2)} (${c.verdict})</h2>
      <div class="meter"><div class="fill" style="width:${c.fraud_probability*100}%"></div></div>
      <div class="muted">${d.stop_reason}</div>
    </section>
    <section class="panel">
      <h2>Evidence (${c.pattern}${c.pattern_description ? ' — ' + c.pattern_description : ''})</h2>
      ${evRows}
    </section>
    <section class="panel">
      <h2>Next best action — before / after evidence</h2>
      <div class="nba-cols">
        <div><h3>Initial</h3>${d.next_best_actions.initial.map(a=>nbaRow(a,'initial')).join('') || '<div class="muted">none</div>'}</div>
        <div><h3>Final</h3>${d.next_best_actions.final.map(a=>nbaRow(a,'final')).join('') || '<div class="muted">none</div>'}</div>
      </div>
      <div class="muted" style="margin-top:8px">What changed: ${d.next_best_actions.what_changed}</div>
    </section>
    ${d.sar.file ? `<section class="panel"><h2>Suspicious Activity Report</h2>
      <div class="muted">${d.sar.reason}</div>
      <pre class="narrative">${d.sar.narrative}</pre>
      <div class="muted">Subjects: ${d.sar.subjects.join(', ')} · $${d.sar.total_amount_usd.toLocaleString()} · ${d.sar.activity_dates.join(' → ')}</div>
    </section>` : ''}
    <section class="panel">
      <h2>Case memory</h2>
      <div class="muted">Similar prior cases: ${c.similar_prior_cases.join(', ') || 'none'}</div>
      <div class="muted">Written to graph: ${c.written_to_graph ? `yes (${c.graph_case_id})` : 'no'}</div>
    </section>
  `;
}

async function approve(action, decision) {
  await fetch(`/api/cases/${currentCase}/approve`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action, decision})});
  openCase(currentCase);
}

$('#chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const log = $('#chat-log');
  const userMsg = `Investigate txn ${fd.get('flagged_txn_id')} on ${fd.get('card_id')}: ${fd.get('trigger_text')}`;
  log.innerHTML += `<div class="chat-msg user">${userMsg}</div>`;
  const spinnerId = 'sp-' + Date.now();
  log.innerHTML += `<div class="chat-msg" id="${spinnerId}"><span class="spinner"></span> investigating...</div>`;
  log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch('/api/investigate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      flagged_txn_id: parseInt(fd.get('flagged_txn_id')), card_id: fd.get('card_id'), customer_id: fd.get('customer_id'),
      trigger_text: fd.get('trigger_text'), trigger_type: 'analyst_request'
    })});
    const d = await r.json();
    $(`#${spinnerId}`).outerHTML = r.ok
      ? `<div class="chat-msg">Done — <b>${d.case_id}</b>: ${d.case.verdict} / ${d.case.pattern} (p=${d.case.fraud_probability.toFixed(2)}). ${d.case.summary}</div>`
      : `<div class="chat-msg">Error: ${JSON.stringify(d)}</div>`;
    await loadCases();
    if (r.ok) openCase(d.case_id);
  } catch (err) {
    $(`#${spinnerId}`).outerHTML = `<div class="chat-msg">Error: ${err}</div>`;
  }
  e.target.reset();
});

loadCases();
</script>
</body>
</html>
